         /* Sidebar Styles */
         .menu-icon {
            position: fixed;
            top: 15px;
            left: 15px;
            font-size: 24px;
            cursor: pointer;
            z-index: 1001;
            transition: opacity 0.3s ease-in-out;
        }

        .menu-icon.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .left-section {
            position: fixed;
            top: 0;
            left: -300px;
            width: 250px;
            height: 100vh;
            background: linear-gradient(135deg, #000000 0%, #000000 100%);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: 0.3s;
            z-index: 1000;
        }

        .left-section.active {
            left: 0;
        }

        .nav-menu {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        .nav-menu li {
            margin: 15px 0;
        }

        .nav-menu a {
            color: rgb(255, 255, 255);
            text-decoration: none;
            font-size: 18px;
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .nav-menu a:hover {
            background-color: #000000;
        }
    </style>

    <script>
        function updateFormFields() {
            const selectedCategory = document.getElementById("categorySelect").value;
            document.querySelectorAll(".category-fields").forEach(field => field.style.display = "none");
            if (selectedCategory) {
                const selectedFields = document.getElementById(selectedCategory + "Fields");
                if (selectedFields) selectedFields.style.display = "block";
            }
        }

        document.addEventListener("DOMContentLoaded", updateFormFields);

        document.getElementById("imageInput").addEventListener("change", function(event) {
            const preview = document.getElementById("imagePreview");
            preview.innerHTML = "";  
            if (this.files.length > 5) {
                alert("You can only upload up to 5 images.");
                this.value = "";  
                return;
            }
            Array.from(this.files).forEach(file => {
                const img = document.createElement("img");
                img.src = URL.createObjectURL(file);
                preview.appendChild(img);
            });
        });

        document.getElementById("adForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            
            const formData = new FormData(this);

            // Get all brand fields
            const carBrand = this.elements['car_brand']?.value;
            const bikeBrand = this.elements['bike_brand']?.value;
            const mobileBrand = this.elements['mobile_brand']?.value;
            const cameraBrand = this.elements['camera_brand']?.value;

            // Determine which one has a value (non-empty)
            let brand = carBrand || bikeBrand || mobileBrand || cameraBrand || electronicsType || ""; // add more if needed

            // Add it to formData (if not empty)
            if (brand) {
                formData.append("brand", brand);
            }
            
            const response = await fetch("https://sphere.vercel.app/post-ad", {
                method: "POST",
                body: formData
            });
            

            const result = await response.json();
            if (result.success) {
                alert("Ad Posted Successfully!");
                loadAds();  
                this.reset();
                document.getElementById("imagePreview").innerHTML = ""; 
            } else {
                alert("Error posting ad.");
            }
        });

        async function loadAds() {
            const response = await fetch("https://sphere.vercel.app/post-ad");
            const ads = await response.json();
            const container = document.getElementById("adsContainer");
            container.innerHTML = "";  
            ads.forEach(ad => {
                const adDiv = document.createElement("div");
                adDiv.classList.add("ad-card");
                adDiv.innerHTML = `<strong>Category:</strong> ${ad.category}<br>
                    <strong>Description:</strong> ${ad.description}<br>
                    ${ad.images.map(img => `<img src="https://sphere.vercel.app/uploads/${img}" width="100">`).join('')}`;
                container.appendChild(adDiv);
            });
        }

        loadAds();
        // Toggle sidebar menu
        function toggleMenu() {
            const menu = document.getElementById("leftMenu");
            const menuIcon = document.getElementById("menuIcon");
            menu.classList.toggle("active");
            menuIcon.classList.toggle("hidden");
        }

        // Close menu function
        function closeMenu() {
            const menu = document.getElementById("leftMenu");
            const menuIcon = document.getElementById("menuIcon");
            menu.classList.remove("active");
            menuIcon.classList.remove("hidden");
        }
        // Close menu when clicking outside
        document.addEventListener('click', function(e) {
            const menu = document.getElementById("leftMenu");
            const menuIcon = document.getElementById("menuIcon");
            if (!menu.contains(e.target) && !menuIcon.contains(e.target)) {
                closeMenu();
            }
        });
    
        // Get current location & fill the input
function getCurrentLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            // OPTIONAL: Use reverse geocoding to get human-readable address
            // For simplicity, we'll just show lat/lon here
            const locationField = document.getElementById("location");
            locationField.value = `Lat: ${lat}, Lon: ${lon}`;

            // You can replace this with a real address by calling a geocoding API like OpenCage or Google Maps.
        }, () => {
            alert("Unable to retrieve your location.");
        });
    } else {
        alert("Geolocation is not supported by this browser.");
    }
}


    </script>
