<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Rentsphere</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            font-family: 'Arial', sans-serif;
        }
        .login-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .bg-nature {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            position: relative;
            overflow: hidden;
        }
        .bg-nature::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="1" d="M0,160L48,176C96,192,192,224,288,229.3C384,235,480,213,576,186.7C672,160,768,128,864,133.3C960,139,1056,181,1152,197.3C1248,213,1344,203,1392,197.3L1440,192L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320L192,320L96,320L0,320Z"></path></svg>') no-repeat bottom;
            background-size: cover;
        }
        .mountain {
            position: absolute;
            background: rgba(0,0,0,0.1);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        .stars {
            position: absolute;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="login-container overflow-hidden">
            <div class="bg-nature relative p-6 text-center text-white">
                <div class="absolute inset-0 overflow-hidden">
                    <!-- Mountain and Star Silhouettes -->
                    <div class="mountain top-10 left-0 w-1/3 h-1/2 opacity-20"></div>
                    <div class="mountain top-20 right-0 w-1/4 h-2/5 opacity-20"></div>
                    
                    <!-- Stars -->
                    <div class="stars w-1 h-1 top-10 left-10"></div>
                    <div class="stars w-1 h-1 top-20 right-20"></div>
                    <div class="stars w-1 h-1 bottom-10 left-1/3"></div>
                </div>
                <h2 class="text-2xl font-bold relative z-10">Welcome to Rentsphere</h2>
                <p class="text-sm opacity-80 relative z-10">Create your account to get started</p>
            </div>
            
            <form id="signupForm" class="p-6 space-y-4">
                <input 
                    type="text" 
                    id="name" 
                    placeholder="Full Name" 
                    class="w-full p-3 border rounded-md"
                    required
                >
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Email" 
                    class="w-full p-3 border rounded-md"
                    required
                >
                <input 
                    type="date" 
                    id="dob" 
                    placeholder="Date of Birth" 
                    class="w-full p-3 border rounded-md"
                    required
                >
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Password" 
                    class="w-full p-3 border rounded-md"
                    required
                >
                <button 
                    type="submit" 
                    class="w-full bg-green-500 text-white p-3 rounded-md hover:bg-green-600 transition"
                >
                    Sign Up
                </button>
                <p class="text-center text-sm">
                    Already have an account? 
                    <a href="login.html" class="text-green-500 hover:underline">Login</a>
                </p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mongoose@5.12.3/dist/mongoose.min.js"></script>
    <script>
        // Signup Page Script
document.getElementById('signupForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const dob = document.getElementById('dob').value;
    const password = document.getElementById('password').value.trim();

    // Enhanced password validation
    const passwordRegex = /^(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,}$/;
    if (!passwordRegex.test(password)) {
        alert('Password must be at least 8 characters long, contain at least one uppercase letter, one number, and one special character.');
        return;
    }

    try {
        const response = await fetch('http://localhost:5000/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, dateOfBirth: dob, password })
        });

        const data = await response.json();
        if (data.success) {
            // Store user ID for potential later use
            localStorage.setItem('tempUserId', data.userId);
            alert('Signup successful! Please log in.');
            window.location.href = 'login.html';
        } else {
            alert(data.message || 'Signup failed');
        }
    } catch (error) {
        console.error('Signup Error:', error);
        alert('Network error. Please try again.');
    }
});

window.onload = async function () {
    try {
        const response = await fetch('/api/get-user', {
            credentials: 'include' // Ensures the token is sent with the request
        });

        if (response.ok) {
            const data = await response.json();

            // Check if success is true and user object is not empty
            if (data.success && Object.keys(data.user).length > 0) {
                window.location.href = "/account.html"; // Redirect logged-in users
                return;
            }
        }
    } catch (error) {
        console.error('Error checking login status:', error);
    }
};
        
    </script>
</body>
</html>
