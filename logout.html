<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color:  #e0eee8;;
            max-width: 480px;
            margin: 0 auto;
            text-align: center;
            padding: 20px;
        }

        .header {
            padding: 16px;
            background-color: #000;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .logout-container {
            margin-top: 50px;
        }

        .logout-button {
            background-color: #ff3b30;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .logout-button:hover {
            background-color: #e60000;
        }

        .message {
            margin-top: 20px;
            font-size: 16px;
            color: #002f34;
        }
    </style>
</head>
<body>

    <div class="header">Logout</div>

    <div class="logout-container">
        <p class="message">Are you sure you want to log out?</p><br>
        <button class="logout-button" onclick="logoutUser()">Logout</button>
    </div>

    <script>
        function logoutUser() {
            // Clear session storage & local storage (optional)
            sessionStorage.clear();
            localStorage.removeItem("userToken"); // Remove token if used

            // Redirect to login page
            window.location.href = "login.html"; // Change to your actual login page
        }
    </script>

</body>
</html>
